<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Skyline Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #05050a;
            color: #00ffff;
            overflow-x: hidden;
            user-select: none;
        }
        .glow-text {
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
        }
        .glow-box {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        canvas {
            background: linear-gradient(to bottom, #090a1f, #1a0b2e);
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.3);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header / Scoreboard -->
    <div class="w-full max-w-xl flex justify-between items-center mb-4 px-2">
        <div>
            <h1 class="text-xs sm:text-sm text-pink-500 glow-text mb-1">NEON RUNNER</h1>
            <p class="text-[10px] text-gray-400">Gunakan Panah Kiri/Kanan atau Tombol</p>
        </div>
        <div class="text-right">
            <div class="text-xs sm:text-sm text-cyan-400">SKOR: <span id="scoreVal">0</span></div>
            <div class="text-[10px] text-pink-400 mt-1">REKOR: <span id="highScoreVal">0</span></div>
        </div>
    </div>

    <!-- Game Canvas Container -->
    <div class="relative rounded-xl overflow-hidden glow-box border border-cyan-500/50">
        <canvas id="gameCanvas" width="480" height="600" class="block w-full max-w-[480px] h-auto"></canvas>
        
        <!-- Start / Game Over Screen Overlay -->
        <div id="menuOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center text-center p-6">
            <h2 id="menuTitle" class="text-lg sm:text-xl text-cyan-400 glow-text mb-4">NEON SKYLINE</h2>
            <p id="menuSubtitle" class="text-[10px] text-pink-400 mb-6 leading-relaxed">Hindari rintangan merah neon dan kumpulkan baterai energi!</p>
            <button id="actionBtn" onclick="startGame()" class="px-6 py-3 bg-pink-600 hover:bg-pink-500 text-white text-xs sm:text-sm rounded shadow-[0_0_15px_#ff007f] transition transform active:scale-95 cursor-pointer">
                MULAI GAME
            </button>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="w-full max-w-xl flex justify-between mt-6 px-4 gap-4">
        <button id="leftBtn" class="flex-1 py-4 bg-cyan-900/60 border border-cyan-500/50 text-cyan-400 rounded-lg text-lg active:bg-cyan-700/80 transition">&#9664; KIRI</button>
        <button id="rightBtn" class="flex-1 py-4 bg-cyan-900/60 border border-cyan-500/50 text-cyan-400 rounded-lg text-lg active:bg-cyan-700/80 transition">KANAN &#9654;</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreVal = document.getElementById("scoreVal");
        const highScoreVal = document.getElementById("highScoreVal");
        const menuOverlay = document.getElementById("menuOverlay");
        const menuTitle = document.getElementById("menuTitle");
        const menuSubtitle = document.getElementById("menuSubtitle");
        const actionBtn = document.getElementById("actionBtn");

        let score = 0;
        let highScore = localStorage.getItem("neon_runner_highscore") || 0;
        highScoreVal.innerText = highScore;

        let gameRunning = false;
        let gameSpeed = 4;
        let frames = 0;

        // Player Config (3 Lanes)
        const lanes = [95, 240, 385];
        let player = {
            laneIndex: 1,
            x: lanes[1],
            y: 500,
            width: 40,
            height: 50,
            color: "#00ffff"
        };

        let obstacles = [];
        let particles = [];
        let stars = [];

        // Generate background stars
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        function startGame() {
            score = 0;
            gameSpeed = 4;
            frames = 0;
            obstacles = [];
            particles = [];
            player.laneIndex = 1;
            player.x = lanes[player.laneIndex];
            gameRunning = true;
            menuOverlay.classList.add("hidden");
            loop();
        }

        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("neon_runner_highscore", highScore);
                highScoreVal.innerText = highScore;
            }
            menuTitle.innerText = "GAME OVER";
            menuSubtitle.innerText = `Skor Akhir Anda: ${score}\nRekor Tertinggi: ${highScore}`;
            actionBtn.innerText = "MAIN LAGI";
            menuOverlay.classList.remove("hidden");
        }

        // Controls
        function moveLeft() {
            if (!gameRunning) return;
            if (player.laneIndex > 0) {
                player.laneIndex--;
                player.x = lanes[player.laneIndex];
                createParticles(player.x + 20, player.y + 40, "#00ffff");
            }
        }

        function moveRight() {
            if (!gameRunning) return;
            if (player.laneIndex < lanes.length - 1) {
                player.laneIndex++;
                player.x = lanes[player.laneIndex];
                createParticles(player.x + 20, player.y + 40, "#00ffff");
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") moveLeft();
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") moveRight();
        });

        document.getElementById("leftBtn").addEventListener("click", moveLeft);
        document.getElementById("rightBtn").addEventListener("click", moveRight);

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    size: Math.random() * 3 + 1,
                    color: color,
                    life: 20
                });
            }
        }

        function spawnObstacle() {
            let laneIdx = Math.floor(Math.random() * lanes.length);
            let isBattery = Math.random() < 0.25; // 25% chance item bonus
            obstacles.push({
                lane: laneIdx,
                x: lanes[laneIdx],
                y: -60,
                width: 40,
                height: isBattery ? 30 : 45,
                isBattery: isBattery
            });
        }

        function update() {
            frames++;
            score += Math.floor(gameSpeed / 2);
            scoreVal.innerText = score;

            // Increase difficulty gradually
            if (frames % 300 === 0) {
                gameSpeed += 0.5;
            }

            // Spawn obstacles
            if (frames % Math.max(30, 90 - Math.floor(gameSpeed * 5)) === 0) {
                spawnObstacle();
            }

            // Update stars
            stars.forEach(star => {
                star.y += star.speed + gameSpeed * 0.2;
                if (star.y > canvas.height) star.y = 0;
            });

            // Update obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed;

                // Collision detection
                let obs = obstacles[i];
                let playerBox = { x: player.x - 20, y: player.y, w: player.width, h: player.height };
                let obsBox = { x: obs.x - 20, y: obs.y, w: obs.width, h: obs.height };

                if (
                    playerBox.x < obsBox.x + obsBox.w &&
                    playerBox.x + playerBox.w > obsBox.x &&
                    playerBox.y < obsBox.y + obsBox.h &&
                    playerBox.y + playerBox.h > obsBox.y
                ) {
                    if (obs.isBattery) {
                        score += 250;
                        createParticles(obs.x, obs.y, "#00ff66");
                        obstacles.splice(i, 1);
                        continue;
                    } else {
                        createParticles(player.x, player.y, "#ff0055");
                        gameOver();
                        return;
                    }
                }

                // Remove off-screen obstacles
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars background
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1.0;

            // Draw Road Lanes
            ctx.strokeStyle = "rgba(0, 255, 255, 0.15)";
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -frames * gameSpeed;
            
            lanes.forEach(laneX => {
                ctx.beginPath();
                ctx.moveTo(laneX, 0);
                ctx.lineTo(laneX, canvas.height);
                ctx.stroke();
            });
            ctx.setLineDash([]); // Reset line dash

            // Draw Player Ship
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffff";
            ctx.fillStyle = "#00ffff";
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x - 20, player.y + 50);
            ctx.lineTo(player.x + 20, player.y + 50);
            ctx.closePath();
            ctx.fill();

            // Draw Obstacles & Items
            obstacles.forEach(obs => {
                if (obs.isBattery) {
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#00ff66";
                    ctx.fillStyle = "#00ff66";
                    ctx.fillRect(obs.x - 15, obs.y, 30, 30);
                } else {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#ff0055";
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(obs.x - 20, obs.y, 40, 45);
                }
            });

            // Draw Particles
            ctx.shadowBlur = 8;
            particles.forEach(p => {
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            ctx.shadowBlur = 0; // Reset shadow
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
